<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../resources/NewLogo.svg">
  <link rel="apple-touch-icon" href="../resources/NewLogo.svg">
  <link rel="stylesheet" href="../resources/common.css?v=1.2.0">
  <title>Percentage Calculator — PocketEngineer</title>
  <meta name="description"
    content="Free percentage calculator — compute X% of Y, what % X is of Y, percentage change, markup, discount, and tip. Instant results with visual bar breakdown.">
  <link rel="canonical" href="https://www.pockeng.com/tools/percentage.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.pockeng.com/tools/percentage.html">
  <meta property="og:title" content="Percentage Calculator — PocketEngineer">
  <meta property="og:description"
    content="Calculate percentages instantly — X% of Y, what percent, change, markup and discount. Visual bar breakdown included.">
  <meta property="og:image" content="https://www.pockeng.com/tools/resources/icon_256_256.png">
  <script src="../resources/app.js?v=1.2.0"></script>
  <link rel="stylesheet" href="../resources/tailwind.css?v=1.2.0">
  <link rel="stylesheet" href="../resources/fonts.css?v=1.2.0">
  <style>
    body {
      font-feature-settings: "cv05", "cv08", "ss01";
      -webkit-font-smoothing: antialiased;
      background-color: #fafafa;
    }

    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    .ios-input-wrapper {
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .ios-input-wrapper:focus-within {
      border-color: #18181b;
      background-color: white;
      box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05);
      transform: translateY(-1px);
    }

    .mode-btn {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-btn:hover:not(.active) {
      color: #18181b;
      background: #f4f4f5;
    }

    .mode-btn.active {
      background: #18181b;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-animate {
      animation: fadeSlideIn 0.3s ease-out;
    }
  </style>
</head>

<body class="text-zinc-900 antialiased min-h-screen flex flex-col selection:bg-zinc-200 selection:text-zinc-900">

  <!-- Header -->
  <header class="flex-none bg-white/80 backdrop-blur-sm border-b border-zinc-200/50 z-50 sticky top-0">
    <div class="max-w-lg mx-auto px-6 h-16 flex items-center justify-between">
      <a href="../index.html" class="back-button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 18l-6-6 6-6" />
        </svg>
        Back
      </a>
      <h1 class="text-lg font-semibold text-zinc-900 tracking-tight">Percentage Calculator</h1>
      <div class="w-20"></div>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center px-6 py-8 max-w-lg mx-auto w-full">

    <!-- Visualization Card -->
    <div class="w-full mb-6">
      <div class="bg-white rounded-2xl border border-zinc-200 shadow-sm p-5">
        <!-- Donut Chart -->
        <div class="flex justify-center mb-4">
          <canvas id="percentCanvas" class="block"></canvas>
        </div>

        <!-- Result Display -->
        <div class="relative overflow-hidden bg-[#18181b] text-white rounded-xl p-4 group transition-transform duration-500 hover:scale-[1.01]">
          <div class="absolute -top-10 -right-10 w-32 h-32 bg-zinc-600 blur-[70px] opacity-30 rounded-full pointer-events-none"></div>
          <div class="relative z-10 flex items-center justify-between">
            <p class="text-zinc-400 text-xs font-semibold select-none" id="result-label">25% of 200</p>
            <div class="flex items-baseline gap-1">
              <span id="display-result" class="text-3xl font-mono font-medium tracking-tighter">50</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls Card -->
    <div class="w-full mb-6">
      <div class="bg-white rounded-2xl border border-zinc-200 shadow-sm p-5 space-y-5">

        <!-- Mode Selector -->
        <div>
          <label class="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-3">Mode</label>
          <div class="grid grid-cols-2 gap-1.5 bg-zinc-100 rounded-xl p-1.5" id="mode-selector">
            <button class="mode-btn active text-[11px] font-semibold px-3 py-2.5 rounded-lg" data-mode="of" onclick="setMode('of')">X% of Y</button>
            <button class="mode-btn text-[11px] font-semibold px-3 py-2.5 rounded-lg text-zinc-500" data-mode="what" onclick="setMode('what')">X is ?% of Y</button>
            <button class="mode-btn text-[11px] font-semibold px-3 py-2.5 rounded-lg text-zinc-500" data-mode="change" onclick="setMode('change')">% Change</button>
            <button class="mode-btn text-[11px] font-semibold px-3 py-2.5 rounded-lg text-zinc-500" data-mode="markup" onclick="setMode('markup')">Markup / Discount</button>
          </div>
        </div>

        <!-- Mode: X% of Y -->
        <div id="panel-of" class="panel-animate">
          <div class="flex items-center gap-2 mb-3">
            <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Inputs</label>
            <span class="h-px bg-zinc-100 flex-1"></span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-6">X</label>
              <input type="number" id="of-x" value="25" oninput="calcOf()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
              <span class="text-xs text-zinc-400 font-medium ml-2 w-4 text-center select-none">%</span>
            </div>
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-6">Y</label>
              <input type="number" id="of-y" value="200" oninput="calcOf()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
            </div>
          </div>
        </div>

        <!-- Mode: X is ?% of Y -->
        <div id="panel-what" class="hidden">
          <div class="flex items-center gap-2 mb-3">
            <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Inputs</label>
            <span class="h-px bg-zinc-100 flex-1"></span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-6">X</label>
              <input type="number" id="what-x" value="50" oninput="calcWhat()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
            </div>
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-6">Y</label>
              <input type="number" id="what-y" value="200" oninput="calcWhat()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
            </div>
          </div>
        </div>

        <!-- Mode: % Change -->
        <div id="panel-change" class="hidden">
          <div class="flex items-center gap-2 mb-3">
            <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Inputs</label>
            <span class="h-px bg-zinc-100 flex-1"></span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-8">Old</label>
              <input type="number" id="change-old" value="80" oninput="calcChange()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
            </div>
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-8">New</label>
              <input type="number" id="change-new" value="100" oninput="calcChange()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
            </div>
          </div>
        </div>

        <!-- Mode: Markup / Discount -->
        <div id="panel-markup" class="hidden">
          <div class="flex items-center gap-2 mb-3">
            <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Inputs</label>
            <span class="h-px bg-zinc-100 flex-1"></span>
          </div>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-8">Val</label>
              <input type="number" id="markup-val" value="100" oninput="calcMarkup()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
            </div>
            <div class="ios-input-wrapper flex items-center bg-white border border-zinc-200 rounded-lg px-3 py-2.5">
              <label class="text-sm font-medium text-zinc-500 shrink-0 select-none w-8">Rate</label>
              <input type="number" id="markup-rate" value="15" oninput="calcMarkup()"
                class="text-right w-full bg-transparent border-none p-0 text-sm font-mono font-medium focus:ring-0 text-zinc-900 outline-none">
              <span class="text-xs text-zinc-400 font-medium ml-2 w-4 text-center select-none">%</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button id="btn-markup" class="text-[11px] font-semibold py-2 rounded-lg bg-zinc-900 text-white transition-colors hover:bg-zinc-800" onclick="setMarkupDir(1)">Markup +</button>
            <button id="btn-discount" class="text-[11px] font-semibold py-2 rounded-lg border border-zinc-200 text-zinc-500 transition-colors hover:bg-zinc-50" onclick="setMarkupDir(-1)">Discount −</button>
          </div>
        </div>

      </div>
    </div>

    <!-- Breakdown -->
    <div class="w-full" id="breakdown"></div>

  </main>

  <script>
    const canvas = document.getElementById('percentCanvas');
    const ctx = canvas.getContext('2d');

    let currentMode = 'of';
    let markupDir = 1;
    let displayPercent = 0;
    let displayTotal = 0;
    let displayPart = 0;
    let animTarget = 0;
    let animCurrent = 0;

    const modes = ['of', 'what', 'change', 'markup'];

    function setMode(mode) {
      currentMode = mode;
      modes.forEach(m => {
        const panel = document.getElementById('panel-' + m);
        panel.classList.toggle('hidden', m !== mode);
        if (m === mode) panel.classList.add('panel-animate');
        const btn = document.querySelector('[data-mode="' + m + '"');
        btn.classList.toggle('active', m === mode);
        if (m === mode) {
          btn.classList.remove('text-zinc-500');
        } else {
          btn.classList.add('text-zinc-500');
        }
      });
      recalc();
    }

    function setMarkupDir(dir) {
      markupDir = dir;
      document.getElementById('btn-markup').className = dir === 1
        ? 'text-[11px] font-semibold py-2 rounded-lg bg-zinc-900 text-white transition-colors hover:bg-zinc-800'
        : 'text-[11px] font-semibold py-2 rounded-lg border border-zinc-200 text-zinc-500 transition-colors hover:bg-zinc-50';
      document.getElementById('btn-discount').className = dir === -1
        ? 'text-[11px] font-semibold py-2 rounded-lg bg-zinc-900 text-white transition-colors hover:bg-zinc-800'
        : 'text-[11px] font-semibold py-2 rounded-lg border border-zinc-200 text-zinc-500 transition-colors hover:bg-zinc-50';
      calcMarkup();
    }

    function recalc() {
      if (currentMode === 'of') calcOf();
      else if (currentMode === 'what') calcWhat();
      else if (currentMode === 'change') calcChange();
      else calcMarkup();
    }

    function calcOf() {
      const x = parseFloat(document.getElementById('of-x').value) || 0;
      const y = parseFloat(document.getElementById('of-y').value) || 0;
      const result = (x / 100) * y;
      displayPercent = x;
      displayTotal = y;
      displayPart = result;
      animTarget = Math.min(Math.abs(x), 100);
      document.getElementById('result-label').textContent = x + '% of ' + y;
      document.getElementById('display-result').textContent = result.toFixed(4).replace(/\.?0+$/, '');
      updateBreakdown(x, y, result);
    }

    function calcWhat() {
      const x = parseFloat(document.getElementById('what-x').value) || 0;
      const y = parseFloat(document.getElementById('what-y').value) || 0;
      const result = y !== 0 ? (x / y) * 100 : 0;
      displayPercent = result;
      displayTotal = y;
      displayPart = x;
      animTarget = Math.min(Math.abs(result), 100);
      document.getElementById('result-label').textContent = x + ' is what % of ' + y;
      document.getElementById('display-result').textContent = result.toFixed(4).replace(/\.?0+$/, '') + '%';
      updateBreakdown(result, y, x);
    }

    function calcChange() {
      const oldVal = parseFloat(document.getElementById('change-old').value) || 0;
      const newVal = parseFloat(document.getElementById('change-new').value) || 0;
      const change = oldVal !== 0 ? ((newVal - oldVal) / Math.abs(oldVal)) * 100 : 0;
      const sign = change >= 0 ? '+' : '';
      displayPercent = Math.abs(change);
      displayTotal = oldVal;
      displayPart = newVal;
      animTarget = Math.min(Math.abs(change), 100);
      document.getElementById('result-label').textContent = 'Change from ' + oldVal + ' → ' + newVal;
      document.getElementById('display-result').textContent = sign + change.toFixed(2) + '%';
      document.getElementById('breakdown').innerHTML =
        '<div class="bg-zinc-50 border border-zinc-200 rounded-xl p-3">' +
        '<p class="text-[10px] font-bold text-zinc-400 uppercase tracking-wide mb-1">Difference</p>' +
        '<p class="text-base font-mono font-semibold text-zinc-900">' + sign + (newVal - oldVal).toFixed(4).replace(/\.?0+$/, '') + '</p></div>';
    }

    function calcMarkup() {
      const val = parseFloat(document.getElementById('markup-val').value) || 0;
      const rate = parseFloat(document.getElementById('markup-rate').value) || 0;
      const delta = val * (rate / 100) * markupDir;
      const result = val + delta;
      displayPercent = rate;
      displayTotal = val;
      displayPart = Math.abs(delta);
      animTarget = Math.min(rate, 100);
      const label = markupDir === 1 ? 'Markup' : 'Discount';
      document.getElementById('result-label').textContent = label + ' ' + rate + '% on ' + val;
      document.getElementById('display-result').textContent = result.toFixed(4).replace(/\.?0+$/, '');
      document.getElementById('breakdown').innerHTML =
        '<div class="grid grid-cols-2 gap-3">' +
        '<div class="bg-zinc-50 border border-zinc-200 rounded-xl p-3">' +
        '<p class="text-[10px] font-bold text-zinc-400 uppercase tracking-wide mb-1">Original</p>' +
        '<p class="text-base font-mono font-semibold text-zinc-900">' + val + '</p></div>' +
        '<div class="bg-zinc-50 border border-zinc-200 rounded-xl p-3">' +
        '<p class="text-[10px] font-bold text-zinc-400 uppercase tracking-wide mb-1">' + label + ' Amount</p>' +
        '<p class="text-base font-mono font-semibold text-zinc-900">' + (markupDir === 1 ? '+' : '−') + Math.abs(delta).toFixed(2) + '</p></div></div>';
    }

    function updateBreakdown(pct, total, part) {
      const remainder = total - part;
      document.getElementById('breakdown').innerHTML =
        '<div class="grid grid-cols-2 gap-3">' +
        '<div class="bg-zinc-50 border border-zinc-200 rounded-xl p-3">' +
        '<p class="text-[10px] font-bold text-zinc-400 uppercase tracking-wide mb-1">Part</p>' +
        '<p class="text-base font-mono font-semibold text-zinc-900">' + part.toFixed(4).replace(/\.?0+$/, '') + '</p></div>' +
        '<div class="bg-zinc-50 border border-zinc-200 rounded-xl p-3">' +
        '<p class="text-[10px] font-bold text-zinc-400 uppercase tracking-wide mb-1">Remainder</p>' +
        '<p class="text-base font-mono font-semibold text-zinc-900">' + remainder.toFixed(4).replace(/\.?0+$/, '') + '</p></div></div>';
    }

    // Canvas
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const size = Math.min(240, window.innerWidth - 40);
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }

    function animate() {
      animCurrent += (animTarget - animCurrent) * 0.08;
      drawVis();
      requestAnimationFrame(animate);
    }

    function drawVis() {
      const s = parseFloat(canvas.style.width);
      ctx.clearRect(0, 0, s, s);

      const cx = s / 2;
      const cy = s / 2;
      const outerR = s * 0.42;
      const innerR = outerR * 0.62;
      const pct = Math.max(0, Math.min(animCurrent, 100));
      const angle = (pct / 100) * Math.PI * 2;
      const lineW = outerR - innerR;

      // Track ring (background)
      ctx.beginPath();
      ctx.arc(cx, cy, outerR - lineW / 2, 0, Math.PI * 2);
      ctx.strokeStyle = '#e4e4e7';
      ctx.lineWidth = lineW;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Filled arc with gradient
      if (pct > 0.2) {
        const grad = ctx.createLinearGradient(cx - outerR, cy - outerR, cx + outerR, cy + outerR);
        grad.addColorStop(0, '#18181b');
        grad.addColorStop(1, '#52525b');
        ctx.beginPath();
        ctx.arc(cx, cy, outerR - lineW / 2, -Math.PI / 2, -Math.PI / 2 + angle);
        ctx.strokeStyle = grad;
        ctx.lineWidth = lineW;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // Center text
      ctx.font = 'bold 26px JetBrains Mono';
      ctx.fillStyle = '#18181b';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pct.toFixed(1) + '%', cx, cy - 4);

      // Sub-label
      ctx.font = '500 10px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = '#a1a1aa';
      ctx.fillText(currentMode === 'change' ? 'change' : 'of total', cx, cy + 14);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    calcOf();
    requestAnimationFrame(animate);

    // Mobile keyboard fix
    let keyboardOpen = false;
    let historyStatePushed = false;
    document.querySelectorAll('input[type="number"]').forEach(input => {
      input.addEventListener('focus', () => {
        keyboardOpen = true;
        if (!historyStatePushed) {
          history.pushState({ keyboardOpen: true }, '');
          historyStatePushed = true;
        }
      });
      input.addEventListener('blur', () => {
        keyboardOpen = false;
        historyStatePushed = false;
      });
    });
    window.addEventListener('popstate', (e) => {
      if (keyboardOpen) {
        const activeElement = document.activeElement;
        if (activeElement && activeElement.tagName === 'INPUT') {
          activeElement.blur();
          history.pushState({ keyboardOpen: true }, '');
          e.preventDefault();
        }
      }
    });
  </script>
</body>

</html>
