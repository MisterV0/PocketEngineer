  <style>
    body {
      font-feature-settings: "cv05", "cv08", "ss01";
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    /* ---- Matrix grids: columns shrink to fit the screen, capped at their desktop size ---- */
    .matrix-bracket {
      --gap: 4px;
      box-sizing: border-box;
      padding: 8px 6px;
      /* cells + gaps + horizontal padding (12px) */
      width: calc(var(--n) * var(--cell-max) + (var(--n) - 1) * var(--gap) + 12px);
      max-width: 100%;
    }

    .matrix-grid {
      display: grid;
      gap: var(--gap);
      grid-template-columns: repeat(var(--n), minmax(0, 1fr));
      width: 100%;
    }

    .matrix-cell {
      width: 100%;
      min-width: 0;
      height: 42px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(11px, 2.9vw, 14px);
      font-weight: 500;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      background: #fafafa;
      padding: 0 2px;
    }

    .matrix-cell:focus {
      border-color: #18181b;
      background: white;
      box-shadow: 0 0 0 2px rgba(24, 24, 27, 0.08);
    }

    .result-cell {
      width: 100%;
      min-width: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(10px, 2.7vw, 14px);
      font-weight: 600;
      background: white;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      color: #18181b;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 3px;
    }

    @media (max-width: 640px) {
      .matrix-cell {
        height: 38px;
      }

      .result-cell {
        height: 40px;
      }
    }

    /* ---- Pills ---- */
    .op-pill,
    .size-pill {
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .op-pill.active,
    .size-pill.active {
      background: #18181b;
      color: white;
      border-color: #18181b;
    }

    .op-pill:not(.active):hover,
    .size-pill:not(.active):hover {
      background: #f4f4f5;
      border-color: #d4d4d8;
    }

    .op-pill:focus-visible,
    .size-pill:focus-visible {
      outline: 2px solid #18181b;
      outline-offset: 2px;
    }

    /* ---- Shared tooltip: one compact box, positioned in JS so it never leaves the viewport ---- */
    .op-tip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 60;
      width: max-content;
      max-width: min(250px, calc(100vw - 16px));
      background: #18181b;
      color: #fff;
      border-radius: 10px;
      padding: 9px 11px;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-3px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
      line-height: 1.45;
    }

    .op-tip.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .op-tip-title {
      font-size: 11.5px;
      font-weight: 600;
    }

    .op-tip-desc {
      font-size: 11px;
      color: #d4d4d8;
      margin-top: 2px;
    }

    .op-tip-formula {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #fafafa;
      background: #27272a;
      border-radius: 5px;
      padding: 2px 6px;
      margin-top: 6px;
      display: inline-block;
    }

    .op-tip-note {
      font-size: 10.5px;
      color: #a1a1aa;
      margin-top: 5px;
    }

    .op-tip-arrow {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #18181b;
      transform: rotate(45deg);
      top: -4px;
    }

    .op-tip.above .op-tip-arrow {
      top: auto;
      bottom: -4px;
    }

    /* Touch devices get the always-visible summary under the result instead */
    @media (hover: none) {
      .op-tip {
        display: none;
      }
    }

  <!-- One shared tooltip for every operation pill -->
  <div id="op-tip" class="op-tip" role="tooltip">

  <script>

    // ============================================
    // OPERATION CATALOGUE
    // kind:   'binary' uses B as well, 'unary' works on A alone
    // out:    'matrix' fills the result grid, 'scalar' shows a single number
    // param:  optional k / n input shown in the controls bar
    // ============================================
    const OPS = {
      add: {
        title: 'Addition', kind: 'binary', out: 'matrix',
        desc: 'Adds the two matrices entry by entry.',
        formula: 'C(i,j) = A(i,j) + B(i,j)',
        note: 'Only defined when A and B share the same size.'
      },
      sub: {
        title: 'Subtraction', kind: 'binary', out: 'matrix',
        desc: 'Subtracts every entry of B from the matching entry of A.',
        formula: 'C(i,j) = A(i,j) − B(i,j)',
        note: 'A − B and B − A differ by a sign on every entry.'
      },
      mul: {
        title: 'Multiplication', kind: 'binary', out: 'matrix',
        desc: 'Each entry is a row of A dotted with a column of B.',
        formula: 'C(i,j) = Σₖ A(i,k)·B(k,j)',
        note: 'Order matters: A × B is usually not B × A.'
      },
      trans: {
        title: 'Transpose', kind: 'unary', out: 'matrix',
        desc: 'Mirrors A across its main diagonal, so rows become columns.',
        formula: 'Aᵀ(i,j) = A(j,i)',
        note: 'A is symmetric exactly when Aᵀ = A.'
      },
      inv: {
        title: 'Inverse', kind: 'unary', out: 'matrix',
        desc: 'The matrix that undoes A, found by Gauss-Jordan elimination.',
        formula: 'A · A⁻¹ = I',
        note: 'Exists only when det A ≠ 0.'
      },
      pow: {
        title: 'Matrix power', kind: 'unary', out: 'matrix',
        param: { key: 'n', label: 'n', def: 2, step: 1, min: -10, max: 10, hint: 'whole number from −10 to 10 (negative powers invert A first)' },
        desc: 'Multiplies A by itself n times — not an entry-by-entry power.',
        formula: 'Aⁿ = A · A · … · A',
        note: 'A⁰ = I. Negative n needs A to be invertible.'
      },
      scale: {
        title: 'Scalar multiple', kind: 'unary', out: 'matrix',
        param: { key: 'k', label: 'k', def: 2, step: 'any', hint: 'any number, decimals allowed' },
        desc: 'Multiplies every entry of A by the same number k.',
        formula: 'C(i,j) = k · A(i,j)',
        note: 'Scales the determinant by kⁿ, not by k.'
      },
      det: {
        title: 'Determinant', kind: 'unary', out: 'scalar',
        desc: 'One number: the factor by which A scales area or volume.',
        formula: 'det A',
        note: 'det A = 0 means the rows are dependent and A has no inverse.'
      },
      trace: {
        title: 'Trace', kind: 'unary', out: 'scalar',
        desc: 'Adds up the entries on the main diagonal of A.',
        formula: 'tr A = Σᵢ A(i,i)',
        note: 'Equals the sum of the eigenvalues of A.'
      },
      rank: {
        title: 'Rank', kind: 'unary', out: 'scalar',
        desc: 'How many rows of A are linearly independent, via row reduction.',
        formula: 'rank A ≤ n',
        note: 'rank A < n means A is singular — det A = 0.'
      }
    };

    let size = 2;
    let op = 'add';

    const $ = id => document.getElementById(id);

    // ============================================
    // CONTROLS
    // ============================================
    function setSize(n) {
      const previous = { a: snapshot('a'), b: snapshot('b') };
      size = n;
      document.querySelectorAll('[data-size]').forEach(b => {
        const isActive = parseInt(b.dataset.size, 10) === n;
        b.classList.toggle('active', isActive);
        b.classList.toggle('text-zinc-500', !isActive);
      });
      buildGrids();
      restore('a', previous.a);
      restore('b', previous.b);
      compute();
    }

    function setOp(o) {
      op = o;
      const def = OPS[o];
      document.querySelectorAll('[data-op]').forEach(b => {
        const isActive = b.dataset.op === o;
        b.classList.toggle('active', isActive);
        b.classList.toggle('text-zinc-500', !isActive);
      });

      $('matrix-b-section').classList.toggle('hidden', def.kind !== 'binary');

      // Contextual k / n field
      const row = $('param-row');
      if (def.param) {
        const p = def.param;
        row.classList.remove('hidden');
        row.classList.add('flex');
        $('param-label').textContent = p.label;
        $('param-hint').textContent = p.hint;
        const input = $('param-input');
        input.step = p.step;
        if (p.min !== undefined) input.min = p.min; else input.removeAttribute('min');
        if (p.max !== undefined) input.max = p.max; else input.removeAttribute('max');
        input.value = p.def;
      } else {
        row.classList.add('hidden');
        row.classList.remove('flex');
      }

      // Always-visible explanation of what is being computed
      $('op-formula').textContent = def.formula;
      $('op-desc').textContent = def.desc;

      // Swap between the grid and the single-number readout
      const scalar = def.out === 'scalar';
      $('result-matrix-wrap').classList.toggle('hidden', scalar);
      $('result-scalar-wrap').classList.toggle('hidden', !scalar);

      compute();
    }

    // ============================================
    // GRID BUILDING
    // ============================================
    function buildGrids() {
      buildGrid('matrix-a', 'bracket-a', 'a');
      buildGrid('matrix-b', 'bracket-b', 'b');
      buildResultGrid();
    }

    function sizeBracket(bracketId, cellMax) {
      const bracket = $(bracketId);
      bracket.style.setProperty('--n', size);
      bracket.style.setProperty('--cell-max', cellMax + 'px');
    }

    function buildGrid(containerId, bracketId, prefix) {
      sizeBracket(bracketId, 58);
      const container = $(containerId);
      container.innerHTML = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const input = document.createElement('input');
          input.type = 'number';
          input.className = 'matrix-cell';
          input.id = prefix + '-' + r + '-' + c;
          input.value = (r === c) ? 1 : 0;
          input.setAttribute('aria-label', prefix.toUpperCase() + ' row ' + (r + 1) + ' column ' + (c + 1));
          input.addEventListener('input', compute);
          container.appendChild(input);
        }
      }
    }

    function buildResultGrid() {
      sizeBracket('bracket-result', 72);
      const container = $('matrix-result');
      container.innerHTML = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = document.createElement('div');
          cell.className = 'result-cell';
          cell.id = 'r-' + r + '-' + c;
          cell.textContent = '0';
          container.appendChild(cell);
        }
      }
    }

    // Keep whatever the user already typed when the size changes
    function snapshot(prefix) {
      const values = {};
      document.querySelectorAll('[id^="' + prefix + '-"]').forEach(el => { values[el.id] = el.value; });
      return values;
    }

    function restore(prefix, values) {
      Object.keys(values).forEach(id => {
        const el = $(id);
        if (el) el.value = values[id];
      });
    }

    function fillMatrix(prefix, value) {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const el = $(prefix + '-' + r + '-' + c);
          if (!el) continue;
          if (value === 'random') {
            el.value = Math.floor(Math.random() * 19) - 9;
          } else if (value === 'identity') {
            el.value = (r === c) ? 1 : 0;
          } else {
            el.value = value;
          }
        }
      }
      compute();
    }

    function getMatrix(prefix) {
      const m = [];
      for (let r = 0; r < size; r++) {
        m[r] = [];
        for (let c = 0; c < size; c++) {
          const el = $(prefix + '-' + r + '-' + c);
          m[r][c] = el ? (parseFloat(el.value) || 0) : 0;
        }
      }
      return m;
    }

    // ============================================
    // OUTPUT
    // ============================================
    // Formats a number to at most `budget` characters, so it always fits its cell.
    // Grid cells are narrow (72px on desktop, less on phones); the exact value is
    // kept in the cell's title attribute.
    function fmt(v, budget) {
      if (!Number.isFinite(v)) return '—';
      budget = budget || 7;
      if (Math.abs(v) < 1e-10) return '0';                       // numerical dust
      if (Math.abs(v) < 1e-6) return v.toExponential(1);         // tiny but genuinely non-zero
      const rounded = Math.round(v * 1e6) / 1e6;
      if (Number.isInteger(rounded) && Math.abs(rounded) < 1e6) return String(rounded);
      const exact = String(rounded);
      if (exact.length <= budget && exact.indexOf('e') === -1) return exact;
      for (let digits = 6; digits >= 1; digits--) {
        const text = String(parseFloat(rounded.toPrecision(digits)));
        if (text.length <= budget && text.indexOf('e') === -1) return text;
      }
      return rounded.toExponential(1);
    }

    function clearError() {
      $('error-msg').classList.add('hidden');
    }

    function showError(msg) {
      const el = $('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = $('r-' + r + '-' + c);
          if (cell) { cell.textContent = '—'; cell.removeAttribute('title'); }
        }
      }
      $('result-scalar').textContent = '—';
      $('result-scalar-note').textContent = '';
    }

    function setResult(m) {
      clearError();
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = $('r-' + r + '-' + c);
          if (!cell) continue;
          const v = m[r][c];
          cell.textContent = fmt(v);
          // Full precision on hover / long-press, since cells are narrow
          if (Number.isFinite(v)) cell.title = String(v); else cell.removeAttribute('title');
        }
      }
    }

    function setScalar(value, note) {
      clearError();
      $('result-scalar').textContent = fmt(value, 12);
      $('result-scalar').title = Number.isFinite(value) ? String(value) : '';
      $('result-scalar-note').textContent = note || '';
    }

    // ============================================
    // MATH
    // ============================================
    function identity(n) {
      return Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => i === j ? 1 : 0));
    }

    function multiply(A, B) {
      const n = A.length;
      const R = Array.from({ length: n }, () => Array(n).fill(0));
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++)
          for (let k = 0; k < n; k++)
            R[i][j] += A[i][k] * B[k][j];
      return R;
    }

    // Scale-aware tolerance, so a matrix of large numbers is not judged by an absolute epsilon
    function tolerance(M) {
      let max = 0;
      M.forEach(row => row.forEach(v => { max = Math.max(max, Math.abs(v)); }));
      return 1e-9 * Math.max(1, max);
    }

    // Determinant by LU decomposition with partial pivoting
    function determinant(M) {
      const n = M.length;
      const a = M.map(r => r.slice());
      const tol = tolerance(M);
      let det = 1;
      for (let i = 0; i < n; i++) {
        let p = i;
        for (let r = i + 1; r < n; r++) if (Math.abs(a[r][i]) > Math.abs(a[p][i])) p = r;
        if (Math.abs(a[p][i]) < tol) return 0;
        if (p !== i) { const t = a[p]; a[p] = a[i]; a[i] = t; det = -det; }
        det *= a[i][i];
        for (let r = i + 1; r < n; r++) {
          const f = a[r][i] / a[i][i];
          for (let c = i; c < n; c++) a[r][c] -= f * a[i][c];
        }
      }
      return det;
    }

    // Inverse by Gauss-Jordan elimination; null when A is singular
    function inverse(M) {
      const n = M.length;
      const tol = tolerance(M);
      const a = M.map((row, i) => row.concat(identity(n)[i]));
      for (let i = 0; i < n; i++) {
        let p = i;
        for (let r = i + 1; r < n; r++) if (Math.abs(a[r][i]) > Math.abs(a[p][i])) p = r;
        if (Math.abs(a[p][i]) < tol) return null;
        if (p !== i) { const t = a[p]; a[p] = a[i]; a[i] = t; }
        const pivot = a[i][i];
        for (let c = 0; c < 2 * n; c++) a[i][c] /= pivot;
        for (let r = 0; r < n; r++) {
          if (r === i) continue;
          const f = a[r][i];
          if (f === 0) continue;
          for (let c = 0; c < 2 * n; c++) a[r][c] -= f * a[i][c];
        }
      }
      return a.map(row => row.slice(n));
    }

    function rank(M) {
      const n = M.length;
      const a = M.map(r => r.slice());
      const tol = tolerance(M);
      let rk = 0;
      for (let c = 0; c < n && rk < n; c++) {
        let p = rk;
        for (let r = rk + 1; r < n; r++) if (Math.abs(a[r][c]) > Math.abs(a[p][c])) p = r;
        if (Math.abs(a[p][c]) < tol) continue;
        const t = a[p]; a[p] = a[rk]; a[rk] = t;
        for (let r = 0; r < n; r++) {
          if (r === rk) continue;
          const f = a[r][c] / a[rk][c];
          for (let k = c; k < n; k++) a[r][k] -= f * a[rk][k];
        }
        rk++;
      }
      return rk;
    }

    function matrixPower(A, n) {
      if (!Number.isInteger(n)) throw new Error('The exponent n has to be a whole number.');
      if (Math.abs(n) > 10) throw new Error('Keep the exponent between −10 and 10.');
      let base = A;
      if (n < 0) {
        base = inverse(A);
        if (!base) throw new Error('A is singular (det A = 0), so negative powers are undefined.');
        n = -n;
      }
      let R = identity(A.length);
      for (let i = 0; i < n; i++) R = multiply(R, base);
      return R;
    }

    function paramValue() {
      const raw = parseFloat($('param-input').value);
      return Number.isFinite(raw) ? raw : 0;
    }

    // ============================================
    // COMPUTE
    // ============================================
    function compute() {
      const def = OPS[op];
      const A = getMatrix('a');
      let result;

      try {
        switch (op) {
          case 'add': {
            const B = getMatrix('b');
            result = A.map((row, r) => row.map((v, c) => v + B[r][c]));
            break;
          }
          case 'sub': {
            const B = getMatrix('b');
            result = A.map((row, r) => row.map((v, c) => v - B[r][c]));
            break;
          }
          case 'mul':
            result = multiply(A, getMatrix('b'));
            break;
          case 'trans':
            result = A[0].map((_, c) => A.map(row => row[c]));
            break;
          case 'inv':
            result = inverse(A);
            if (!result) throw new Error('A is singular (det A = 0), so it has no inverse.');
            break;
          case 'pow':
            result = matrixPower(A, paramValue());
            break;
          case 'scale': {
            const k = paramValue();
            result = A.map(row => row.map(v => k * v));
            break;
          }
          case 'det': {
            const d = determinant(A);
            setScalar(d, Math.abs(d) < tolerance(A) ? 'Singular — A has no inverse.' : 'Non-zero — A is invertible.');
            return;
          }
          case 'trace':
            setScalar(A.reduce((sum, row, i) => sum + row[i], 0), 'Sum of the ' + size + ' diagonal entries.');
            return;
          case 'rank': {
            const rk = rank(A);
            setScalar(rk, rk === size ? 'Full rank — all rows independent.' : 'Rank-deficient — ' + (size - rk) + ' dependent row' + (size - rk === 1 ? '' : 's') + '.');
            return;
          }
        }
      } catch (e) {
        showError(e.message);
        return;
      }

      if (def.out === 'matrix') setResult(result);
    }

    // ============================================
    // SHARED TOOLTIP (desktop hover only)
    // ============================================
    const tip = $('op-tip');
    const tipArrow = $('op-tip-arrow');
    const canHover = window.matchMedia('(hover: hover)').matches;

    function showTip(pill) {
      const def = OPS[pill.dataset.op];
      if (!def) return;
      $('op-tip-title').textContent = def.title;
      $('op-tip-desc').textContent = def.desc;
      $('op-tip-formula').textContent = def.formula;
      $('op-tip-note').textContent = def.note;

      // Measure before placing, then clamp inside the viewport
      tip.style.left = '0px';
      tip.style.top = '0px';
      tip.classList.add('show');

      const pad = 8;
      const r = pill.getBoundingClientRect();
      const w = tip.offsetWidth;
      const h = tip.offsetHeight;

      let left = r.left + r.width / 2 - w / 2;
      left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));

      let top = r.bottom + 9;
      const above = top + h > window.innerHeight - pad;
      if (above) top = Math.max(pad, r.top - h - 9);
      tip.classList.toggle('above', above);

      tip.style.left = left + 'px';
      tip.style.top = top + 'px';

      // Point the arrow at the pill, kept inside the rounded corners
      const arrow = Math.max(12, Math.min(r.left + r.width / 2 - left, w - 12)) - 4;
      tipArrow.style.left = arrow + 'px';
    }

    function hideTip() {
      tip.classList.remove('show');
    }

    // ============================================
    // WIRING
    // ============================================
    document.querySelectorAll('[data-size]').forEach(btn => {
      btn.addEventListener('click', () => setSize(parseInt(btn.dataset.size, 10)));
    });

    document.querySelectorAll('[data-op]').forEach(btn => {
      btn.addEventListener('click', () => { setOp(btn.dataset.op); hideTip(); });
      if (canHover) {
        btn.addEventListener('mouseenter', () => showTip(btn));
        btn.addEventListener('mouseleave', hideTip);
        btn.addEventListener('focus', () => showTip(btn));
        btn.addEventListener('blur', hideTip);
      }
    });

    document.querySelectorAll('[data-fill]').forEach(btn => {
      btn.addEventListener('click', () => {
        const raw = btn.dataset.value;
        fillMatrix(btn.dataset.fill, (raw === 'identity' || raw === 'random') ? raw : parseFloat(raw));
      });
    });

    $('param-input').addEventListener('input', compute);
    window.addEventListener('scroll', hideTip, true);
    window.addEventListener('resize', hideTip);

    buildGrids();
    setOp('add');

  </script>
